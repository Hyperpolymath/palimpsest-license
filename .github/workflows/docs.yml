# SPDX-License-Identifier: PMPL-1.0-or-later
name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.adoc'
      - 'legal/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.adoc'
      - 'legal/**'

permissions:
  actions: read
  contents: read

jobs:
  build-docs:
    name: Build AsciiDoc docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Build key docs
        run: |
          mkdir -p build/docs
          find . -name '*.adoc' -print0 | xargs -0 -n1 asciidoctor -D build/docs

  link-check:
    name: Check external links (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-linux-x86_64.tar.gz \
            | tar xz
          sudo mv lychee /usr/local/bin

      - name: Run link checker
        run: |
          lychee --no-progress --max-redirects 5 --retry-wait-time 2 --timeout 10 \
            README.adoc docs || true
